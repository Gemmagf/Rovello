services:
  - type: web
    name: rovello-backend
    env: python
    plan: free
    # NOTA: si el servei es va crear manualment al dashboard, els valors del
    # dashboard tenen prioritat sobre aquest fitxer. El servidor es baixa el
    # model (best.onnx) del GitHub Release ell mateix si no el troba.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -b 0.0.0.0:$PORT server:app
    envVars:
      - key: ROVELLO_MODEL_BACKEND
        value: onnx
      - key: ROVELLO_MODEL_URL
        sync: false
      - key: ROVELLO_PRIOR_URL
        sync: false
      - key: ROVELLO_LABEL_MAP_URL
        sync: false
      - key: ROVELLO_CONFIG_URL
        sync: false
      - key: ROVELLO_LOG_LEVEL
        value: INFO
